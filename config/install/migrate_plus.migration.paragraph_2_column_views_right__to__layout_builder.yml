id: paragraph_2_column_views_right__to__layout_builder
label: Drupal 7 2_column_views Paragraphs (right text column)
migration_group: paragraphs_to_layout_builder
dependencies:
  enforced:
    module:
      - osu_migrations
      - paragraphs_to_layout_builder
migration_tags:
  - Drupal 7
  - Content
  - Layout content
  - OSU Paragraphs
  - OSU
  - CAS Paragraphs
  - CAS

# Right text column of 2_column_views; see the _left migration for why the
# bundle migrates at all.
source:
  plugin: osu_d7_paragraphs_item
  bundle: 2_column_views
  key: migrate
process:
  type:
    plugin: default_value
    default_value: 'paragraph_block'
  body:
    - plugin: sub_process
      source: field_right_text
      process:
        value:
          plugin: osu_media_wysiwyg_filter
          source: value
        format:
          plugin: default_value
          default_value: 'full_html'
  info:
    plugin: default_value
    default_value: 'Migrated d7 paragraph 2_column_views'
  reusable:
    plugin: default_value
    default_value: 0

destination:
  plugin: entity:block_content

migration_dependencies:
  required:
    - upgrade_d7_files
    - upgrade_d7_users_with_roles
    - upgrade_d7_media_images
  optional: [ ]
