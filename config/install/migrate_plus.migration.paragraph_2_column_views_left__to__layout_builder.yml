id: paragraph_2_column_views_left__to__layout_builder
label: Drupal 7 2_column_views Paragraphs (left text column)
migration_group: paragraphs_to_layout_builder
dependencies:
  enforced:
    module:
      - osu_migrations
      - paragraphs_to_layout_builder
migration_tags:
  - Drupal 7
  - Content
  - Layout content
  - OSU Paragraphs
  - OSU
  - CAS Paragraphs
  - CAS

# The 2_column_views bundle pairs two view references with two rich-text
# columns. 35 of its 41 live items carry text and no view at all — editors
# used it as a plain two-column layout — so the text columns migrate like any
# other 2-col paragraph while the embedded views stay excluded (views are not
# migrated). CasParagraphsLayout skips the section only when both text
# columns are empty.
source:
  plugin: osu_d7_paragraphs_item
  bundle: 2_column_views
  key: migrate
process:
  type:
    plugin: default_value
    default_value: 'paragraph_block'
  body:
    - plugin: sub_process
      source: field_left_content
      process:
        value:
          plugin: osu_media_wysiwyg_filter
          source: value
        format:
          plugin: default_value
          default_value: 'full_html'
  info:
    plugin: default_value
    default_value: 'Migrated d7 paragraph 2_column_views'
  reusable:
    plugin: default_value
    default_value: 0

destination:
  plugin: entity:block_content

migration_dependencies:
  required:
    - upgrade_d7_files
    - upgrade_d7_users_with_roles
    - upgrade_d7_media_images
  optional: [ ]
