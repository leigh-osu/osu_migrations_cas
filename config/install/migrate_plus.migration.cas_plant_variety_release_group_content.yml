langcode: en
status: true
dependencies: {  }
id: cas_plant_variety_release_group_content
migration_tags:
  - Drupal 7 OG
  - OSU Groups Content
  - OSU Groups
  - OSU
  - CAS
  - CAS Groups
migration_group: osu_groups
label: 'Migrate D7 plant_variety_release nodes into Group content'
source:
  plugin: d7_og_membership_content
  node_type:
    - plant_variety_release
process:
  label: etid
  type:
    plugin: default_value
    default_value: group_content_type_b60da5dff9dd0
  gid:
    - plugin: migration_lookup
      migration: upgrade_d7_node_og_group
      no_stub: true
      source: gid
    - plugin: skip_on_empty
      method: row
      message: 'gid is missing'
  entity_id:
    - plugin: migration_lookup
      migration: cas_pvr_to_pvr
      no_stub: true
      source: etid
    - plugin: skip_on_empty
      method: row
      message: 'node missing.'
destination:
  plugin: 'entity:group_content'
migration_dependencies:
  required:
    - upgrade_d7_node_og_group
    - cas_pvr_to_pvr
