langcode: en
status: true
id: cas_active_user_og_memberships
label: 'Group memberships for active role-less users (plain member, no group role)'
migration_group: osu_groups
dependencies: {  }
migration_tags:
  - Drupal 7 OG
  - CAS Groups
  - OSU
  - CAS
source:
  plugin: d7_og_membership_user
process:
  label: etid
  type:
    plugin: default_value
    default_value: basic_group-group_membership
  # Deliberately NO group_roles: unlike upgrade_d7_user_og_memberships
  # (which stamps basic_group-content_author on every membership), these
  # users must not get any editing role. Bare membership gives them only the
  # insider basic_group-member role: view group/pages + view/update their
  # OWN osu_profile — nothing else.
  gid:
    - plugin: migration_lookup
      migration:
        - upgrade_d7_node_og_group
        - upgrade_d7_node_parent_unit_group
      no_stub: true
      source: gid
    - plugin: skip_on_empty
      method: row
      message: 'gid is missing'
  entity_id:
    - plugin: migration_lookup
      migration: cas_d7_active_users
      no_stub: true
      source: etid
    - plugin: skip_on_empty
      method: row
      message: 'Not an active role-less user; handled by upgrade_d7_user_og_memberships.'
destination:
  plugin: 'entity:group_content'
migration_dependencies:
  required:
    - cas_d7_active_users
    - upgrade_d7_node_og_group
    - upgrade_d7_node_parent_unit_group
