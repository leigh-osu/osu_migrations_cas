id: paragraph_sacnas_officer_body_text__to__layout_builder
label: Drupal 7 sacnas_officer_body_text Paragraphs
migration_group: paragraphs_to_layout_builder
dependencies:
  enforced:
    module:
      - osu_migrations
      - paragraphs_to_layout_builder
migration_tags:
  - Drupal 7
  - Content
  - Layout content
  - OSU Paragraphs
  - OSU
  - CAS Paragraphs
  - CAS
source:
  plugin: osu_d7_paragraphs_item
  bundle: sacnas_officer_body_text
  key: migrate
process:
  type:
    plugin: default_value
    default_value: 'paragraph_block'
  temp_paragraph_image:
    plugin: get
    source: field_officer_image
  body/value:
    - plugin: extract
      source: field_body_text
      index:
        - 0
        - value
      default: ''
    - plugin: osu_media_wysiwyg_filter
    - plugin: cas_paragraph_image
  body/format:
    plugin: default_value
    default_value: 'full_html'
info:
  plugin: default_value
  default_value: 'Migrated d7 paragraph sacnas_officer_body_text_left'
reusable:
  plugin: default_value
  default_value: 0

destination:
  plugin: entity:block_content

migration_dependencies:
  required:
    - upgrade_d7_files
    - upgrade_d7_users_with_roles
    - upgrade_d7_media_images
  optional: [ ]
