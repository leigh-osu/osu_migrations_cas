langcode: en
status: true
id: cas_aaa_to_aaa
label: 'Basic Art About Agriculture to AAA Migration'
migration_group: content
dependencies: { }
migration_tags:
  - Drupal 7
  - Content
  - Layout content
  - OSU
  - CAS
  - CAS content

source:
  plugin: d7_node_domain_access
  node_type: art_about_agriculture
  high_water_property:
    name: changed

process:
  title: title

  # Body field
  body:
    plugin: sub_process
    source: body
    process:
      value:
        plugin: osu_media_wysiwyg_filter
        source: value
      summary: summary
      format:
        plugin: default_value
        default_value: 'full_html'

  # Artist text fields
  field_aaa_artist:
    plugin: get
    source: field_artist
  field_aaa_artist_first_name:
    plugin: get
    source: field_artist_first_name
  field_aaa_artist_last_name:
    plugin: get
    source: field_artist_last_name

  # Other artwork text fields
  field_aaa_year:
    plugin: get
    source: field_art_year
  field_aaa_awards:
    plugin: get
    source: field_awards
  field_aaa_description:
    plugin: get
    source: field_description
  field_aaa_dimensions:
    plugin: get
    source: field_dimensions
  field_aaa_location:
    plugin: get
    source: field_location
  field_aaa_permission_granted:
    plugin: get
    source: field_permission_granted

  # Media reference fields (D7 image -> D10 media:image)
  field_aaa_artwork:
    plugin: sub_process
    source: field_artwork
    process:
      target_id:
        - plugin: migration_lookup
          migration:
            - upgrade_d7_media_images
            - cas_media_private_images
          source: fid
          no_stub: true
        - plugin: skip_on_empty
          method: process

  field_aaa_thumbnail:
    plugin: sub_process
    source: field_thumbnail
    process:
      target_id:
        - plugin: migration_lookup
          migration:
            - upgrade_d7_media_images
            - cas_media_private_images
          source: fid
          no_stub: true
        - plugin: skip_on_empty
          method: process

  # Taxonomy: D7 field_exhibit (vocab art_about_agriculture) -> D10 field_tax_aaa
  field_tax_aaa:
    plugin: sub_process
    source: field_exhibit
    process:
      target_id:
        - plugin: migration_lookup
          migration: upgrade_d7_taxonomy_terms:art_about_agriculture
          source: tid
          no_stub: true
        - plugin: skip_on_empty
          method: process

  # Meta tags
  field_meta_tags:
    plugin: d7_metatag_entities
    source: pseudo_metatag_entities

  # Path settings
  path/pathauto:
    plugin: default_value
    default_value: 0

  # Content type
  type:
    plugin: default_value
    default_value: art_about_agriculture

  # Domain access fields
  field_domain_access:
    plugin: sub_process
    source: domain_access_node
    process:
      target_id: target_id

  field_domain_all_affiliates:
    plugin: get
    source: domain_all_affiliates

  field_domain_source:
    plugin: get
    source: domain_source

  # Standard node fields
  uid: node_uid
  status: status
  created: created
  changed: changed
  promote: promote
  sticky: sticky

destination:
  plugin: 'entity:node'
  default_bundle: art_about_agriculture

migration_dependencies:
  required:
    - upgrade_d7_files
    - upgrade_d7_users_with_roles
    - upgrade_d7_taxonomy_terms:art_about_agriculture
    - upgrade_d7_media_images