langcode: en
status: true
id: paragraph_1_column_background_video__to__layout_builder
label: Drupal 7 1_column_background_video Paragraphs
migration_group: paragraphs_to_layout_builder
dependencies:
  enforced:
    module:
      - osu_migrations
      - paragraphs_to_layout_builder
migration_tags:
  - Drupal 7
  - Content
  - Layout content
  - OSU Paragraphs
  - OSU
  - CAS Paragraphs
  - CAS
source:
  plugin: osu_d7_paragraphs_item
  bundle: 1_column_background_video
  key: migrate
process:
  type:
    plugin: default_value
    default_value: 'paragraph_block'
  body:
    - plugin: sub_process
      source: field_p_1_col_main
      process:
        value:
          plugin: osu_media_wysiwyg_filter
          source: value
        format:
          plugin: default_value
          default_value: 'full_html'
  field_styles: field_p_1_col_styles
  # The bundle is paragraph_1_col with a video background: resolve the video
  # file to its migrated local_video media id. The "video" background type is
  # implied by the item type when the section is built (CasLayoutBase).
  field_eb_background_fc:
    plugin: file_background
    source: field_paragraph_video
    custom_source_lookup: upgrade_d7_media_local_video
  info:
    plugin: default_value
    default_value: 'Migrated d7 paragraph 1_column_background_video'
  reusable:
    plugin: default_value
    default_value: 0
destination:
  plugin: entity:block_content
migration_dependencies:
  required: [  ]
  optional: [  ]
