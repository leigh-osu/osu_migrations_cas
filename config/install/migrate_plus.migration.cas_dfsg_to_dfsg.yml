langcode: en
status: true
id: cas_dfsg_to_dfsg
label: 'Basic Degree Fact Sheet Graduate to DFSG Migration'
migration_group: content
dependencies: { }
migration_tags:
  - Drupal 7
  - Content
  - Layout content
  - OSU
  - CAS
  - CAS content

source:
  plugin: d7_node_domain_access
  node_type: degree_fact_sheet_graduate
  high_water_property:
    name: changed

process:
  title: title

  # Body
  body:
    plugin: sub_process
    source: body
    process:
      value:
        plugin: osu_media_wysiwyg_filter
        source: value
      summary: summary
      format:
        plugin: default_value
        default_value: 'full_html'

  # Text passthroughs
  field_dfsg_overview:
    plugin: get
    source: field_dfsg_overview
  field_dfsg_alumni_spotlight:
    plugin: get
    source: field_alumni_spotlight
  field_dfsg_program_requirements:
    plugin: get
    source: field_dfsg_program_requirements
  field_dfsg_grad_student_support:
    plugin: get
    source: field_graduate_student_support

  # Integers
  field_dfsg_aaea_fellows:
    plugin: get
    source: field_dfsg_aaea_fellows
  field_dfsg_fellowships:
    plugin: get
    source: field_dfsg_fellowships
  field_dfsg_graduate_students:
    plugin: get
    source: field_dfsg_graduate_students
  field_dfsg_univer_disting_fac:
    plugin: get
    source: field_dfsg_univer_disting_fac

  # List fields
  field_dfsg_degree_focus_area:
    plugin: get
    source: field_degree_focus_area
  field_dfsg_degree_level:
    plugin: get
    source: field_degree_level
  field_dfsg_language:
    plugin: get
    source: field_language
  field_dfsg_level:
    plugin: get
    source: field_level
  field_dfsg_location:
    plugin: get
    source: field_location_dfs

  # Boolean
  field_dfsg_node_hide_title:
    plugin: get
    source: field_node_hide_title

  # Social text fields renamed from group_* to dfsg_*
  field_dfsg_facebook:
    plugin: get
    source: field_group_facebook
  field_dfsg_instagram:
    plugin: get
    source: field_group_instagram
  field_dfsg_linkedin:
    plugin: get
    source: field_group_linkedin
  field_dfsg_twitter:
    plugin: get
    source: field_group_twitter
  field_dfsg_youtube:
    plugin: get
    source: field_group_youtube

  # Link fields
  field_dfsg_cascades_campus:
    plugin: sub_process
    source: field_cascades_campus
    process:
      uri: url
      title: title
  field_dfsg_corvallis_campus:
    plugin: sub_process
    source: field_corvallis_campus
    process:
      uri: url
      title: title
  field_dfsg_la_grande_campus:
    plugin: sub_process
    source: field_la_grande_campus
    process:
      uri: url
      title: title
  field_dfsg_newport_campus:
    plugin: sub_process
    source: field_newport_campus
    process:
      uri: url
      title: title
  field_dfsg_ecampus:
    plugin: sub_process
    source: field_ecampus
    process:
      uri: url
      title: title
  field_dfsg_department_link:
    plugin: sub_process
    source: field_dfs_department_link
    process:
      uri: url
      title: title
  field_dfsg_preferred_link:
    plugin: sub_process
    source: field_dfs_preferred_link
    process:
      uri: url
      title: title
  field_dfsg_osu_catalog:
    plugin: sub_process
    source: field_osu_catalog
    process:
      uri: url
      title: title

  # Image fields
  field_dfsg_banner:
    plugin: sub_process
    source: field_dfs_banner
    process:
      target_id:
        plugin: migration_lookup
        migration: upgrade_d7_files
        source: fid
      alt: alt
      title: title
      width: width
      height: height
  field_dfsg_box_image:
    plugin: sub_process
    source: field_dfs_box_image
    process:
      target_id:
        plugin: migration_lookup
        migration: upgrade_d7_files
        source: fid
      alt: alt
      title: title
      width: width
      height: height
  field_dfsg_photo:
    plugin: sub_process
    source: field_dfs_photo
    process:
      target_id:
        plugin: migration_lookup
        migration: upgrade_d7_files
        source: fid
      alt: alt
      title: title
      width: width
      height: height

  # NOTE: field_dfsg_degrees (D10 paragraph reference) is not yet attached to
  # this bundle and no degree paragraph type exists. Add a separate
  # field_collection -> paragraph migration once that's set up, then map
  # field_dfsg_degrees here.

  # Taxonomy (cas_themes vocab is actually cas_impact_areas in D7)
  field_dfsg_cas_themes:
    plugin: sub_process
    source: field_cas_themes
    process:
      target_id:
        - plugin: migration_lookup
          migration: upgrade_d7_taxonomy_terms:cas_impact_areas
          source: tid
          no_stub: true
        - plugin: skip_on_empty
          method: process

  # Meta tags
  field_meta_tags:
    plugin: d7_metatag_entities
    source: pseudo_metatag_entities

  # Path settings
  path/pathauto:
    plugin: default_value
    default_value: 0

  # Content type
  type:
    plugin: default_value
    default_value: degree_fact_sheet_graduate

  # Domain access
  field_domain_access:
    plugin: sub_process
    source: domain_access_node
    process:
      target_id: target_id
  field_domain_all_affiliates:
    plugin: get
    source: domain_all_affiliates
  field_domain_source:
    plugin: get
    source: domain_source

  # Standard node fields
  uid: node_uid
  status: status
  created: created
  changed: changed
  promote: promote
  sticky: sticky

destination:
  plugin: 'entity:node'
  default_bundle: degree_fact_sheet_graduate

migration_dependencies:
  required:
    - upgrade_d7_files
    - upgrade_d7_users_with_roles
    - upgrade_d7_taxonomy_terms:cas_impact_areas