langcode: en
status: true
id: cas_fun_facts_to_fun_facts
label: 'Basic Fun Facts to Fun Facts Migration'
migration_group: content
dependencies: {  }
migration_tags:
  - Drupal 7
  - Content
  - Layout content
  - OSU
  - CAS
  - CAS Content
source:
  plugin: d7_node_domain_access
  node_type: fun_facts
  high_water_property:
    name: changed

process:
  title: title

  # Body field
  body:
    plugin: sub_process
    source: body
    process:
      value:
        plugin: osu_media_wysiwyg_filter
        source: value
      summary: summary
      format:
        plugin: default_value
        default_value: 'full_html'

  # String fields (D7 text -> D10 string)
  field_fun_facts_category:
    plugin: get
    source: field_category_
  field_fun_facts_source:
    plugin: get
    source: field_fact_source

  # Image field (D7 image -> D10 media:image)
  field_fun_facts_image:
    plugin: sub_process
    source: field_ff_image
    process:
      target_id:
        - plugin: migration_lookup
          migration:
            - upgrade_d7_media_images
            - cas_media_private_images
          source: fid
          no_stub: true
        - plugin: skip_on_empty
          method: process

  # Taxonomy: D7 field_bf_species (entityreference -> vocab big_fish_species)
  field_tax_big_fish_species:
    plugin: sub_process
    source: field_bf_species
    process:
      target_id:
        - plugin: migration_lookup
          migration: upgrade_d7_taxonomy_terms:big_fish_species
          source: target_id
          no_stub: true
        - plugin: skip_on_empty
          method: process

  # Taxonomy: D7 field_bf_topic (entityreference -> vocab big_fish_topics)
  field_tax_big_fish_topic:
    plugin: sub_process
    source: field_bf_topic
    process:
      target_id:
        - plugin: migration_lookup
          migration: upgrade_d7_taxonomy_terms:big_fish_topics
          source: target_id
          no_stub: true
        - plugin: skip_on_empty
          method: process

  # Meta tags
  field_meta_tags:
    plugin: d7_metatag_entities
    source: pseudo_metatag_entities

  # Path settings
  path/pathauto:
    plugin: default_value
    default_value: 0

  # Content type
  type:
    plugin: default_value
    default_value: fun_facts

  # Domain access fields
  field_domain_access:
    plugin: sub_process
    source: domain_access_node
    process:
      target_id: target_id

  field_domain_all_affiliates:
    plugin: get
    source: domain_all_affiliates

  field_domain_source:
    plugin: get
    source: domain_source

  # Standard node fields
  uid: node_uid
  status: status
  created: created
  changed: changed
  promote: promote
  sticky: sticky

destination:
  plugin: 'entity:node'
  default_bundle: fun_facts

migration_dependencies:
  required:
    - upgrade_d7_files
    - upgrade_d7_users_with_roles
    - upgrade_d7_media_images
    - upgrade_d7_taxonomy_terms:big_fish_species
    - upgrade_d7_taxonomy_terms:big_fish_topics