langcode: en
status: true
dependencies:
  enforced:
    module:
      - osu_migrations_cas
id: cas_media_private_documents
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags:
  - 'Drupal 7'
  - 'OSU Media'
  - OSU
migration_group: null
label: 'D7 private-scheme documents -> media (stock media documents cover public only)'
source:
  plugin: cas_d7_file_by_type
  scheme: private
  exclude_webform_only: true
  type: document
  constants:
    source_base_path: '/var/www/html/docroot'
process:
  field_media_file/target_id:
    - plugin: migration_lookup
      migration: upgrade_d7_file_private
      source: fid
      no_stub: true
    - plugin: skip_on_empty
      method: row
  field_media_file/display:
    plugin: default_value
    default_value: 1
  status: status
  created: timestamp
  changed: timestamp
  uid:
    - plugin: migration_lookup
      migration: upgrade_d7_users_with_roles
      source: uid
      no_stub: true
    - plugin: default_value
      default_value: 1
destination:
  plugin: 'entity:media'
  default_bundle: document
migration_dependencies:
  required:
    - upgrade_d7_file_private
    - upgrade_d7_users_with_roles
  optional: {  }
