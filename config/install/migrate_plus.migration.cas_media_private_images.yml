langcode: en
status: true
dependencies:
  enforced:
    module:
      - osu_migrations_cas
id: cas_media_private_images
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags:
  - 'Drupal 7'
  - 'OSU Media'
  - OSU
migration_group: null
label: 'D7 private-scheme images -> media (stock media images cover public only)'
source:
  plugin: cas_d7_file_by_type
  scheme: private
  exclude_webform_only: true
  type: image
  get_alt: true
  get_title: true
  constants:
    source_base_path: '/var/www/html/docroot'
process:
  field_media_image/target_id:
    - plugin: migration_lookup
      migration: upgrade_d7_file_private
      source: fid
      no_stub: true
    - plugin: skip_on_empty
      method: row
  thumbnail/target_id:
    - plugin: migration_lookup
      migration: upgrade_d7_file_private
      source: fid
      no_stub: true
  field_media_image/alt: alt
  field_media_image/title: title
  status: status
  created: timestamp
  changed: timestamp
  uid:
    - plugin: migration_lookup
      migration: upgrade_d7_users_with_roles
      source: uid
      no_stub: true
    - plugin: default_value
      default_value: 1
destination:
  plugin: 'entity:media'
  default_bundle: image
migration_dependencies:
  required:
    - upgrade_d7_file_private
    - upgrade_d7_users_with_roles
  optional: {  }
