langcode: en
status: true
dependencies: {  }
id: cas_page_group_content
migration_tags:
  - Drupal 7 OG
  - OSU Groups Content
  - OSU Groups
  - OSU
  - CAS
  - CAS Groups
migration_group: osu_groups
label: 'Migrate D7 page nodes into Group content'
source:
  plugin: d7_og_membership_content
  node_type:
    - page
process:
  label: etid
  type:
    plugin: default_value
    default_value: basic_group-group_node-page
  gid:
    - plugin: migration_lookup
      migration: cas_node_og_group
      no_stub: true
      source: gid
    - plugin: skip_on_empty
      method: row
      message: 'gid is missing'
  entity_id:
    - plugin: migration_lookup
      migration: cas_page_to_page
      no_stub: true
      source: etid
    - plugin: skip_on_empty
      method: row
      message: 'node missing.'
destination:
  plugin: 'entity:group_content'
migration_dependencies:
  required:
    - cas_node_og_group
    - cas_page_to_page