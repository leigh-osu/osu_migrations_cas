langcode: en
status: true
id: cas_feature_page_to_page
label: 'Feature Page to Basic Page Content Migration'
migration_group: content
dependencies: { }
migration_tags:
  - Drupal 7
  - Content
  - Layout content
  - OSU
  - CAS
  - CAS content

source:
  plugin: d7_node_domain_access
  node_type: feature_page
  high_water_property:
    name: changed

  constants:
    # Map D7 paragraph bundle -> destination migration that produces a
    # corresponding layout_builder section. Mirror cas_page_to_page so the
    # CasParagraphsLayout plugin can resolve every bundle feature_page nodes
    # actually use (paragraph_1_col_clean, paragraph_1_col, paragraph_2_col,
    # paragraph_3_col, 1_column_full_width, paragraph_divider, 4_column,
    # lp_vertical_tabs, lp_picbox_grid).
    map:
      1_column_full_width: 'paragraph_1_column_full_width__to__layout_builder'
      2_column_4_8_left: 'paragraph_2_column_4_8_left__to__layout_builder'
      2_column_4_8_right: 'paragraph_2_column_4_8_right__to__layout_builder'
      paragraph_2_column_8_4_left: 'paragraph_2_column_8_4_left__to__layout_builder'
      paragraph_2_column_8_4_right: 'paragraph_2_column_8_4_right__to__layout_builder'
      accordian: 'paragraph_accordian__to__layout_builder'
      paragraph_1_col_clean: 'paragraph_1_col_clean__to__layout_builder'
      paragraph_1_col: 'paragraph_1_col__to__layout_builder'
      paragraph_2_col: 'paragraph_2_col__to__layout_builder'
      paragraph_2_col_left: 'paragraph_2_col_left__to__layout_builder'
      paragraph_2_col_right: 'paragraph_2_col_right__to__layout_builder'
      paragraph_3_col: 'paragraph_3_col__to__layout_builder'
      paragraph_3_col_left: 'paragraph_3_col_left__to__layout_builder'
      paragraph_3_col_center: 'paragraph_3_col_center__to__layout_builder'
      paragraph_3_col_right: 'paragraph_3_col_right__to__layout_builder'
      4_column: 'paragraph_4_column__to__layout_builder'
      4_column_col1: 'paragraph_4_column_col1__to__layout_builder'
      4_column_col2: 'paragraph_4_column_col2__to__layout_builder'
      4_column_col3: 'paragraph_4_column_col3__to__layout_builder'
      4_column_col4: 'paragraph_4_column_col4__to__layout_builder'
      paragraph_accordion: 'paragraph_accordion__to__layout_builder'
      alert_message: 'paragraph_alert_message__to__layout_builder'
      paragraph_divider: 'paragraph_divider__to__layout_builder'
      paragraph_menu: 'paragraph_menu__to__layout_builder'
      sacnas_officer_body_text: 'paragraph_sacnas_officer_body_text__to__layout_builder'
      lp_vertical_tabs: 'paragraph_lp_vertical_tabs__to__layout_builder'
      lp_picbox_grid: 'paragraph_lp_picbox_grid__to__layout_builder'

process:
  title: title

  # D7 feature_page has no body field — use field_introduction as the body
  # so the intro text doesn't get lost when the destination is plain `page`.
  body:
    plugin: sub_process
    source: field_introduction
    process:
      value:
        plugin: osu_media_wysiwyg_filter
        source: value
      format:
        plugin: default_value
        default_value: 'full_html'

  # Cover photo -> meta image (image -> media reference)
  field_osu_meta_image:
    plugin: sub_process
    source: field_cover_photo
    process:
      target_id:
        - plugin: migration_lookup
          migration: upgrade_d7_media_images
          source: fid
          no_stub: true
        - plugin: skip_on_empty
          method: process

  # Meta tags
  field_meta_tags:
    - plugin: d7_metatag_entities
      source: pseudo_metatag_entities

  # Path settings
  path/pathauto:
    plugin: default_value
    default_value: 0

  # Layout Builder: convert D7 paragraphs into layout sections.
  default_temp:
    plugin: default_layout
    bundle: page
  paragraphs_temp:
    plugin: cas_paragraphs_layout
    source_field: field_paragraph
  layout_builder__layout:
    plugin: get
    source:
      - '@paragraphs_temp'
      - '@default_temp'

  # Content type
  type:
    plugin: default_value
    default_value: page

  # Domain access
  field_domain_access:
    - plugin: sub_process
      source: domain_access_node
      process:
        target_id: target_id
  field_domain_all_affiliates:
    - plugin: get
      source: domain_all_affiliates
  field_domain_source:
    - plugin: get
      source: domain_source

  # Standard node fields
  uid: node_uid
  status: status
  created: created
  changed: changed
  promote: promote
  sticky: sticky

  # NOTE: skipped — no clean D10 destination on `page` bundle:
  #   field_subtitle, field_footer, field_cas_section, field_cas_themes,
  #   field_department, field_sections (D7 field_collection),
  #   group_access, group_content_access, og_group_ref

destination:
  plugin: 'entity:node'
  default_bundle: page

migration_dependencies:
  required:
    - upgrade_d7_files
    - upgrade_d7_users_with_roles
    - upgrade_d7_media_images
  optional:
    - paragraph_1_column_full_width__to__layout_builder
    - paragraph_1_col_clean__to__layout_builder
    - paragraph_1_col__to__layout_builder
    - paragraph_2_col_left__to__layout_builder
    - paragraph_2_col_right__to__layout_builder
    - paragraph_2_column_4_8_left__to__layout_builder
    - paragraph_2_column_4_8_right__to__layout_builder
    - paragraph_2_column_8_4_left__to__layout_builder
    - paragraph_2_column_8_4_right__to__layout_builder
    - paragraph_3_col_left__to__layout_builder
    - paragraph_3_col_center__to__layout_builder
    - paragraph_3_col_right__to__layout_builder
    - paragraph_4_column_col1__to__layout_builder
    - paragraph_4_column_col2__to__layout_builder
    - paragraph_4_column_col3__to__layout_builder
    - paragraph_4_column_col4__to__layout_builder
    - paragraph_accordian__to__layout_builder
    - paragraph_lp_picbox_grid__to__layout_builder
    - paragraph_lp_vertical_tabs__to__layout_builder
    - upgrade_d7_media_audio
    - upgrade_d7_media_documents
    - upgrade_d7_media_kaltura
    - upgrade_d7_media_local_video
    - upgrade_d7_media_remote_video