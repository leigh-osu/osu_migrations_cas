langcode: en
status: true
id: cas_feature_story_to_story
label: 'Feature Story to Story Content Migration'
migration_group: content
dependencies: { }
migration_tags:
  - Drupal 7
  - Content
  - Layout content
  - OSU
  - CAS
  - CAS content

source:
  plugin: d7_node_domain_access
  node_type: feature_story
  high_water_property:
    name: changed

process:
  title: title

  # Body
  body:
    plugin: sub_process
    source: body
    process:
      value:
        plugin: osu_media_wysiwyg_filter
        source: value
      summary: summary
      format:
        plugin: default_value
        default_value: 'full_html'

  # Caption (D7 field_caption -> D10 field_osu_story_caption)
  field_osu_story_caption:
    plugin: get
    source: field_caption

  # Cover image (D7 image -> D10 media reference)
  field_osu_story_cover_image:
    plugin: sub_process
    source: field_picture
    process:
      target_id:
        - plugin: migration_lookup
          migration:
            - upgrade_d7_media_images
            - cas_media_private_images
          source: fid
          no_stub: true
        - plugin: skip_on_empty
          method: process

  # External URL (D7 alt_url -> D10 external_url)
  field_osu_story_external_url:
    plugin: sub_process
    source: field_feature_story_alt_url
    process:
      uri: url
      title: title

  # field_feature_story_front has no destination on D10 story; intentionally skipped.

  # Taxonomies
  field_tags:
    plugin: sub_process
    source: field_tags
    process:
      target_id:
        plugin: migration_lookup
        migration: upgrade_d7_taxonomy_terms:tags
        source: tid

  # Meta tags
  field_meta_tags:
    - plugin: d7_metatag_entities
      source: pseudo_metatag_entities

  # Path settings
  path/pathauto:
    plugin: default_value
    default_value: 0

  # Content type
  type:
    plugin: default_value
    default_value: story

  # Domain access
  field_domain_access:
    - plugin: sub_process
      source: domain_access_node
      process:
        target_id: target_id
  field_domain_all_affiliates:
    - plugin: get
      source: domain_all_affiliates
  field_domain_source:
    - plugin: get
      source: domain_source

  # Standard node fields
  uid: node_uid
  status: status
  created: created
  changed: changed
  promote: promote
  sticky: sticky

destination:
  plugin: 'entity:node'
  default_bundle: story

migration_dependencies:
  required:
    - upgrade_d7_files
    - upgrade_d7_users_with_roles
    - upgrade_d7_taxonomy_terms:tags
    - upgrade_d7_media_images