id: field_collection_field_lp_adj_column__to__layout_builder
label: field_lp_adj_column Field Collections
migration_group: paragraphs_to_layout_builder
migration_tags:
  - Drupal 7
  - Field Collection Content
  - OSU Paragraphs
  - OSU
  - CAS Paragraphs
  - CAS
#deriver: Drupal\paragraphs\Plugin\migrate\D7FieldCollectionItemDeriver
source:
  plugin: d7_field_collection_item
  field_name: field_lp_adj_column
  bundle: group
process:
  type:
    plugin: default_value
    default_value: 'paragraph_block'
  info:
    plugin: default_value
    default_value: 'Migrated d7 lp_adjustable_columns item'
  temp_paragraph_image:
    plugin: get
    source:
      field_lp_col_image
  body/value:
    - plugin: extract
      source: field_lp_col_text
      index:
        - 0
        - value
      default: ''
    - plugin: osu_media_wysiwyg_filter
    - plugin: cas_paragraph_image
  body/format:
    plugin: default_value
    default_value: 'full_html'
  field_block_serialized_data:
    plugin: cas_adjustable_columns_item
destination:
  plugin: entity:block_content
migration_dependencies:
  required: [ ]
  optional: [ ]
